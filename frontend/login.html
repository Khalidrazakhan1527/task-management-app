<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Task Management</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="auth-page">

        <div class="auth-card">

            <!-- ============================= -->
            <!-- HEADER -->
            <!-- ============================= -->

            <div class="auth-header">

                <div class="auth-brand">

                    <div class="auth-logo">
                        ✓
                    </div>

                    <div>

                        <h1>
                            Task Management
                        </h1>

                        <p>
                            Stay organized. Get things done.
                        </p>

                    </div>

                </div>


                <div class="auth-welcome">

                    <span>
                        WELCOME BACK
                    </span>

                    <h2>
                        Sign in to your account
                    </h2>

                    <p>
                        Enter your details to continue.
                    </p>

                </div>

            </div>


            <!-- ============================= -->
            <!-- LOGIN FORM -->
            <!-- ============================= -->

            <form
                id="loginForm"
                class="auth-form"
            >

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="you@example.com"
                    required
                >


                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >


                <!-- FORGOT PASSWORD -->

                <div class="forgot-password-link">

                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="btn primary auth-submit"
                >
                    Sign In
                </button>

            </form>


            <!-- LOGIN MESSAGE -->

            <p
                id="loginMessage"
                class="auth-message"
            ></p>


            <!-- ============================= -->
            <!-- SIGNUP LINK -->
            <!-- ============================= -->

            <div class="auth-switch">

                <span>
                    Don't have an account?
                </span>

                <a href="signup.html">
                    Create account
                </a>

            </div>

        </div>

    </main>


    <!-- AUTH JAVASCRIPT -->

    <script src="auth.js?v=1005"></script>

</body>

</html>
