<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | Task Manager</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <div class="auth-logo">
                    ✓
                </div>

                <h1>
                    Forgot Password?
                </h1>

                <p>
                    Enter your email address and
                    we'll help you reset your password.
                </p>

            </div>


            <form
                id="forgotPasswordForm"
                class="auth-form"
            >

                <div class="form-group">

                    <label for="forgotEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="forgotEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div
                    id="forgotMessage"
                    class="auth-message"
                ></div>


                <button
                    type="submit"
                    class="auth-submit-btn"
                >
                    Send Reset Link
                </button>

            </form>


            <div class="auth-footer">

                <p>

                    Remember your password?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script src="auth.js?v=1002"></script>

</body>

</html>
