<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | Task Manager</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <div class="auth-logo">
                    ✓
                </div>

                <h1>
                    Reset Password
                </h1>

                <p>
                    Enter your new password below.
                </p>

            </div>


            <form
                id="resetPasswordForm"
                class="auth-form"
            >

                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        minlength="6"
                        required
                    >

                </div>


                <div
                    id="resetMessage"
                    class="auth-message"
                ></div>


                <button
                    type="submit"
                    class="auth-submit-btn"
                >
                    Reset Password
                </button>

            </form>


            <div class="auth-footer">

                <p>

                    Remember your password?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script src="auth.js?v=1003"></script>

</body>

</html>
