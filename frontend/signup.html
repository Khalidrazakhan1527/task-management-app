<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up - Task Management</title>

    <link
        rel="stylesheet"
        href="style.css?v=1001"
    >

</head>

<body class="auth-page">

    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-brand">

                <div class="brand-icon">
                    ✓
                </div>

                <div>
                    <h1>Task Management</h1>
                    <p>Stay organized. Get things done.</p>
                </div>

            </div>


            <div class="auth-header">

                <span class="eyebrow">
                    GET STARTED
                </span>

                <h2>
                    Create your account
                </h2>

                <p>
                    Start managing your tasks today.
                </p>

            </div>


            <form id="signupForm">

                <label for="signupName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Your name"
                    required
                >


                <label for="signupEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="you@example.com"
                    required
                >


                <label for="signupPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required
                >


                <button
                    type="submit"
                    class="btn primary auth-submit"
                >
                    Create Account
                </button>

            </form>


            <p
                id="signupMessage"
                class="auth-message"
            ></p>


            <div class="auth-switch">

                <span>
                    Already have an account?
                </span>

                <a href="login.html">
                    Sign in
                </a>

            </div>

        </div>

    </main>


    <script src="auth.js?v=1001"></script>

</body>

</html>
