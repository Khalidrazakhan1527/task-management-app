k<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - Task Management</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <div class="auth-logo">
                    ✓
                </div>

                <h1>
                    Create Account
                </h1>

                <p>
                    Create your account to manage your tasks.
                </p>

            </div>


            <form
                id="signupForm"
                class="auth-form"
            >

                <label for="signupName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Your name"
                    required
                >


                <label for="signupEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="you@example.com"
                    required
                >


                <label for="signupPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required
                >


                <button
                    type="submit"
                    class="btn primary auth-submit"
                >
                    Create Account
                </button>

            </form>


            <p
                id="signupMessage"
                class="auth-message"
            ></p>


            <div class="auth-switch">

                <span>
                    Already have an account?
                </span>

                <a href="login.html">
                    Sign in
                </a>

            </div>

        </div>

    </main>


    <script src="auth.js?v=1004"></script>

</body>

</html>
